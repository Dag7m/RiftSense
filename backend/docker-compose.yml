version: '3.8'

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: seismic-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postash
      POSTGRES_DB: seismic_db
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations:/docker-entrypoint-initdb.d/migrations:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d seismic_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - seismic-network

volumes:
  postgres_data:
    driver: local

networks:
  seismic-network:
    driver: bridge



